<svg width="100%" height="260" viewBox="0 0 1200 260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020409">
        <animate attributeName="stop-color" values="#020409;#0b2559;#020409" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="45%" stop-color="#0b2559">
        <animate attributeName="stop-color" values="#0b2559;#1d4ed8;#0b2559" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#60a5fa">
        <animate attributeName="stop-color" values="#60a5fa;#93c5fd;#60a5fa" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <radialGradient id="glow" cx="85%" cy="10%" r="45%">
      <stop offset="0%" stop-color="#93c5fd" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#93c5fd" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="260" fill="url(#bg)"/>

  <circle cx="1020" cy="40" r="160" fill="url(#glow)">
    <animate attributeName="r" values="160;190;160" dur="4s" repeatCount="indefinite"/>
  </circle>

  <text x="70" y="150" font-family="'Trebuchet MS', Verdana, sans-serif" font-size="62" font-weight="800"
        fill="#ffffff" letter-spacing="2" opacity="0">
    ANDRÉ HEMERLY
    <animate attributeName="opacity" from="0" to="1" dur="1.2s" begin="0.2s" fill="freeze"/>
  </text>

  <g>
    <path fill="#0b2559" opacity="0.85">
      <animate attributeName="d"
        values="
          M0,220 C300,190 700,235 1200,205 L1200,260 L0,260 Z;
          M0,225 C300,200 700,190 1200,220 L1200,260 L0,260 Z;
          M0,220 C300,190 700,235 1200,205 L1200,260 L0,260 Z"
        dur="7s" repeatCount="indefinite"/>
    </path>
    <path fill="#05070d">
      <animate attributeName="d"
        values="
          M0,235 C350,215 650,245 1200,215 L1200,260 L0,260 Z;
          M0,240 C350,220 650,205 1200,235 L1200,260 L0,260 Z;
          M0,235 C350,215 650,245 1200,215 L1200,260 L0,260 Z"
        dur="9s" repeatCount="indefinite"/>
    </path>
  </g>
</svg>
